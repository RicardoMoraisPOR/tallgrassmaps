<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The actual maps from the Pokémon games, starting with Red, Blue and Yellow."
    />
    <title>Tall Grass Maps</title>
    <script>
      try {
        const theme = localStorage.getItem('tall-grass-theme');
        if (
          theme === 'dark' ||
          (!theme && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
